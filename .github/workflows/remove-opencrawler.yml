name: Remove OpenCrawler line
on:
  push:
    branches:
      - add-cl0q-subdomain-enum-2
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: add-cl0q-subdomain-enum-2
      - name: Remove OpenCrawler line
        run: |
          python3 - <<'PYEOF'
          path = "README.md"
          prefix = "- [OpenCrawler](https://github.com/PentesterFlow/OpenCrawler)"
          lines = open(path, encoding="utf-8").read().split("\n")
          out = [l for l in lines if not l.startswith(prefix)]
          if len(out) == len(lines):
              print("OpenCrawler line not present")
          else:
              open(path, "w", encoding="utf-8").write("\n".join(out))
              print("removed ok")
          PYEOF
      - name: Commit and push
        run: |
          git config user.name "cl0q-coder"
          git config user.email "cl0q-coder@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "Remove OpenCrawler line to keep PR focused [skip ci]"
            git push origin HEAD:add-cl0q-subdomain-enum-2
          fi
